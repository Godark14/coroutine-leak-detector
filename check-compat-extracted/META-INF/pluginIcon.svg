<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="19" fill="#7F52FF"/>

  <!-- Coroutine loop (broken circle representing an uncancelled/leaking scope) -->
  <path d="M 20 8
           A 12 12 0 1 1 9.2 26"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linecap="round"/>

  <!-- Arrow head on the loop -->
  <path d="M 9.2 26 L 6.5 23.5 L 6.2 27.3 Z" fill="#FFFFFF"/>

  <!-- Leak drop escaping the loop -->
  <path d="M 29 24
           C 29 26.2 27.2 28 25 28
           C 22.8 28 21 26.2 21 24
           C 21 21.5 25 16.5 25 16.5
           C 25 16.5 29 21.5 29 24 Z"
        fill="#FF6B4A"/>
</svg>
